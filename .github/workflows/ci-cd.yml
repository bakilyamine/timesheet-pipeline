name: CI/CD Timesheet Pipeline API

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: CI - Lint, Tests, Pipeline & Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Verifier la qualite du code
        run: ruff check .

      - name: Lancer les tests
        run: pytest -v

      - name: Executer le pipeline
        run: python -m src.pipeline

      - name: Publier les CSV generes
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs
          path: output/

      - name: Construire l'image Docker
        run: docker build -t timesheet-pipeline-api:ci .

  cd:
    name: CD - Publier l'image sur Docker Hub
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_CONFIGURED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Ignorer la publication sans identifiants Docker Hub
        if: ${{ env.DOCKERHUB_CONFIGURED != 'true' }}
        run: echo "Docker Hub credentials are not configured; image publishing is skipped."

      - name: Connexion Docker Hub
        if: ${{ env.DOCKERHUB_CONFIGURED == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extraire les tags Docker
        id: meta
        if: ${{ env.DOCKERHUB_CONFIGURED == 'true' }}
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/timesheet-pipeline-api
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build et Push de l'image
        if: ${{ env.DOCKERHUB_CONFIGURED == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
